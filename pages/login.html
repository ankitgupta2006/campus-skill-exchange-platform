<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login - Campus Skill Exchange</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/authentication.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <span class="logo-icon">↔</span><span>Campus Skill<br />Exchange</span>
      </div>
      <nav>
        <a href="../index.html">Home</a><a href="skills.html">Find Skills</a
        ><a href="profiles.html">Profiles</a><a href="about.html">About</a
        ><a href="register.html" class="nav-button">Register</a>
      </nav>
    </header>
    <section class="auth-section login-auth-section">
      <div class="auth-box">
        <p class="section-label">WELCOME BACK</p>
        <h1>Continue learning.</h1>
        <p class="auth-description">
          Login to continue exploring your campus skill community.
        </p>
        <form id="loginForm">
          <label for="loginEmail">Campus Email</label
          ><input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          /><label for="loginPassword">Password</label
          ><input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
          /><button type="submit" class="button">Sign In</button>
        </form>
        <p class="form-link">
          Don't have an account? <a href="register.html">Create one</a>
        </p>
      </div>
    </section>
    <footer class="footer"><p>&copy; 2026 Campus Skill Exchange</p></footer>
    <script src="../JS/auth.js"></script>
    <script src="../JS/navigation.js"></script>
  </body>
</html>
