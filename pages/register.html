<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Register - Campus Skill Exchange</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/authentication.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <span class="logo-icon">↔</span><span>Campus Skill<br />Exchange</span>
      </div>
      <nav>
        <a href="../index.html">Home</a><a href="skills.html">Find Skills</a
        ><a href="profiles.html">Profiles</a><a href="about.html">About</a
        ><a href="login.html">Login</a>
      </nav>
    </header>
    <section class="auth-section register-auth-section">
      <div class="auth-box">
        <p class="section-label">JOIN THE COMMUNITY</p>
        <h1>Create your profile.</h1>
        <p class="auth-description">
          Tell the campus community what you know and what you can share.
        </p>
        <form id="registerForm">
          <label for="name">Full Name</label
          ><input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          /><label for="email">Campus Email</label
          ><input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          /><label for="college">College</label
          ><input
            type="text"
            id="college"
            placeholder="Enter your college name"
            required
          /><label for="course">Course / Department</label
          ><input
            type="text"
            id="course"
            placeholder="Example: B.Sc Mathematics"
            required
          /><label for="skills">Skills You Can Teach</label
          ><input
            type="text"
            id="skills"
            placeholder="Example: Java, HTML, Mathematics"
            required
          /><label for="password">Password</label
          ><input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          /><button type="submit" class="button">Create Profile</button>
        </form>
        <p class="form-link">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </section>
    <footer class="footer"><p>&copy; 2026 Campus Skill Exchange</p></footer>
    <script src="../JS/auth.js"></script>
    <script src="../JS/navigation.js"></script>
  </body>
</html>
