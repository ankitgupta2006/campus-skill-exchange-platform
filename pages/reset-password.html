<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reset Password - Campus Skill Exchange</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .toast-container {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 1000;
        display: grid;
        gap: 10px;
        max-width: 360px;
      }
      .toast {
        padding: 13px 16px;
        border-radius: 12px;
        background: #075665;
        color: #fff;
        font-weight: 800;
      }
      .toast.error {
        background: #a83d4a;
      }
    </style>
  </head>
  <body>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <header class="header">
      <a class="logo" href="../index.html"
        ><span class="logo-icon">↔</span><span>Campus Skill<br />Exchange</span></a
      >
      <nav><a href="../index.html">Home</a><a href="login.html">Login</a></nav>
    </header>
    <section class="auth-section login-auth-section">
      <div class="auth-box">
        <p class="section-label">SECURE RESET</p>
        <h1>Create a new password.</h1>
        <p class="auth-description">
          Your reset link is valid for 30 minutes and can be used once.
        </p>
        <form id="resetForm">
          <label for="password">New Password</label>
          <div class="password-field">
            <input id="password" type="password" minlength="6" required /><button
              type="button"
              class="password-toggle"
              data-target="password"
            >
              Show
            </button>
          </div>
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-field">
            <input id="confirmPassword" type="password" minlength="6" required /><button
              type="button"
              class="password-toggle"
              data-target="confirmPassword"
            >
              Show
            </button>
          </div>
          <button id="resetSubmit" class="button" type="submit">Reset Password</button>
        </form>
        <p class="form-link"><a href="login.html">Back to Login</a></p>
      </div>
    </section>
    <footer class="footer">
      <p>&copy; 2026 Campus Skill Exchange</p>
      <a href="privacy-policy.html">Privacy Policy</a>
    </footer>
    <script src="../JS/password-reset.js"></script>
  </body>
</html>
